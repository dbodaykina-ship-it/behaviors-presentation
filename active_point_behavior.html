<title>Active Point</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{height:100%;background:#040405;color:#e7ecf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:18px}
 .stage{position:relative;width:100%;max-width:min(1440px, calc((100vh - 90px) * 1.698));margin:0 auto;overflow:hidden;border-radius:8px}
 .bg{display:block;width:100%;height:auto}
 .layer{position:absolute} .layer img{display:block;width:100%;height:auto}
 #tip{left:75.924%;top:15.094%;width:16.736%;z-index:5;cursor:pointer;opacity:0;
   transform:translateX(-5px) scale(.98);transform-origin:left center;
   transition:opacity .4s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
 #tip.show{opacity:1;transform:none}
 #dot{left:74.132%;top:17.512%;width:1.875%;z-index:6;opacity:0;transition:opacity .25s ease}
 #dot.show{opacity:1}
 #pulse{left:74.167%;top:18.750%;width:1.528%;aspect-ratio:1;z-index:7;border-radius:50%;
   border:1.5px solid #A977F8;opacity:0;transform-origin:center}
 #pulse.go{animation:ping 1.6s ease-out infinite}
 @keyframes ping{0%{transform:scale(.85);opacity:.8}100%{transform:scale(2.5);opacity:0}}
 .panel{display:flex;gap:12px;align-items:center;font-size:13px;color:#8b97a7}
 .btn{background:#1c1c1f;color:#e7ecf2;border:1px solid #2a2a30;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer}
 .btn:hover{border-color:#8a7cf8;background:#23232a}
</style></head>
