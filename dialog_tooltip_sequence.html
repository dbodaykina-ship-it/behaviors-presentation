<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialog Tooltip · последовательность (фон статичен)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#040405;color:#e7ecf2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:18px}
  .stage{position:relative;width:100%;max-width:min(1440px, calc((100vh - 96px) * 1.698));
    margin:0 auto;border-radius:8px;overflow:hidden}
  .bg{display:block;width:100%;height:auto}

  /* меню — выезжающая панель поверх статичного фона */
  #drawer{position:absolute;left:0;top:0;height:100%;width:13.194%;
    transform:translateX(-101%);transition:transform .45s cubic-bezier(.4,0,.2,1);z-index:10}
  #drawer.open{transform:translateX(0)}
  #drawer img{display:block;width:100%;height:100%}

  .tip{transform-origin:center center;opacity:0;transform:scale(.86);
    transition:opacity .6s ease, transform .72s cubic-bezier(.2,.8,.2,1)}
  .tip svg{display:block;width:100%;height:auto}
  .tip.show{opacity:1;transform:none}
  #mkt{position:absolute;left:1.875%;top:5.189%;width:14.722%;z-index:30}

  #riskpos{position:absolute;left:14.236%;top:66.627%;width:12.639%;z-index:30;
    transition:left .65s cubic-bezier(.4,0,.2,1), top .65s cubic-bezier(.4,0,.2,1)}
  #riskpos.moved{left:2.986%;top:65.684%}
  #risk{width:100%}

  #counter{position:absolute;left:1.667%;top:68.868%;width:1.389%;z-index:20;
    transform-origin:center;opacity:0;transform:scale(.3);
    transition:opacity .25s ease, transform .35s cubic-bezier(.2,.9,.3,1.4)}
  #counter img{display:block;width:100%;height:auto}
  #counter.show{opacity:1;transform:none}

  .panel{display:flex;align-items:center;gap:10px;font-size:13px;color:#8b97a7;flex-wrap:wrap;justify-content:center}
  .step{padding:3px 9px;border:1px solid #2a2a30;border-radius:20px;font-size:12px;color:#6b7280;transition:.2s}
  .step.on{border-color:#8a7cf8;color:#cbbcff;background:#1a1726}
  .btn{background:#1c1c1f;color:#e7ecf2;border:1px solid #2a2a30;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#8a7cf8;background:#23232a}
</style>

<script>
  const drawer=document.getElementById('drawer');
  const mkt=document.getElementById('mkt'), risk=document.getElementById('risk'),
        riskpos=document.getElementById('riskpos'), cnt=document.getElementById('counter');
  let timers=[];
  const A=el=>el.classList.add('show'), R=el=>el.classList.remove('show');
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  function reset(){ timers.forEach(clearTimeout); timers=[];
    [mkt,risk,cnt].forEach(R); drawer.classList.remove('open'); riskpos.classList.remove('moved'); }
  function run(){
    reset();
    at(500,  ()=>A(mkt));
    at(3600, ()=>R(mkt));
    at(4200, ()=>drawer.classList.add('open'));
    at(6000, ()=>{A(cnt);A(risk);});
    at(9800, ()=>{drawer.classList.remove('open');riskpos.classList.add('moved');R(cnt);});
    at(13600, run);
  }
  document.getElementById('replay').onclick=run;
  run();
</script>
