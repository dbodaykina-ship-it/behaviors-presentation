<script>
 const app=document.getElementById('app'),banner=document.getElementById('banner'),
       close=document.getElementById('close'),xon=document.getElementById('xon');
 function open(){banner.classList.add('show');app.classList.add('push');}
 function shut(){banner.classList.remove('show');app.classList.remove('push');}
 function syncX(){ close.classList.toggle('off',!xon.checked); }
 close.onclick=()=>{ if(xon.checked) shut(); };
 xon.onchange=syncX;

 syncX(); setTimeout(open,900);
